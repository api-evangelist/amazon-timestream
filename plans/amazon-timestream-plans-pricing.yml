rate_limit_statements:
- TCUs are on-demand and metered per second with a 30-second minimum.
- For provisioned TCUs, you only pay for the duration these TCUs are active in your account, with a minimum
  charge of 1 hour.
- Partial instance-hours are billed in 1-second increments with a 10-minute minimum charge after a billable
  status change
- Data stored in magnetic store is billed by gigabyte-months and for a minimum of 100 GB per account in
  a Region.
- AWS customers receive 100GB of data transfer out to the internet free each month
